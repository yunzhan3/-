<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立体 MBTI 测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #333;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container { max-width: 480px; width: 90%; margin: 0 auto; padding: 20px; }
  
  .landing-box {
    background: #fff;
    border-radius: 20px;
    padding: 48px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  
  .landing-box h1 {
    font-size: 32px;
    margin-bottom: 8px;
    color: #2c3e50;
    font-weight: 700;
  }
  
  .landing-box .subtitle {
    color: #7f8c8d;
    font-size: 15px;
    margin-bottom: 36px;
  }
  
  .version-card {
    display: block;
    background: #f8f9fa;
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 16px;
    text-decoration: none;
    color: inherit;
    transition: all 0.25s ease;
    border: 2px solid transparent;
    cursor: pointer;
  }
  
  .version-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(102,126,234,0.12);
    border-color: #667eea;
  }
  
  .version-card .emoji {
    font-size: 40px;
    margin-bottom: 12px;
    display: block;
  }
  
  .version-card .title {
    font-size: 18px;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 6px;
  }
  
  .version-card .desc {
    font-size: 13px;
    color: #7f8c8d;
    line-height: 1.6;
  }
  
  .version-card .tag {
    display: inline-block;
    background: #667eea;
    color: #fff;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-top: 10px;
    font-weight: 500;
  }
  
  .version-card .tag.orange {
    background: #f39c12;
  }
  
  .footer {
    margin-top: 28px;
    font-size: 12px;
    color: #bbb;
  }
  
  .footer a {
    color: #667eea;
    text-decoration: none;
  }
  
  @media (max-width: 480px) {
    .landing-box { padding: 36px 24px; }
    .landing-box h1 { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="landing-box">
    <h1>🧠 立体 MBTI</h1>
    <p class="subtitle">不是四个字母，而是一张你的"反应地图"</p>
    
    <a href="test.html" class="version-card">
      <span class="emoji">💼</span>
      <div class="title">原版测试</div>
      <div class="desc">48 道情境题，覆盖工作、社交、休闲、压力<br>适合已工作的成年人</div>
      <span class="tag">预计 15-20 分钟</span>
    </a>
    
    <a href="student.html" class="version-card">
      <span class="emoji">🎒</span>
      <div class="title">学生版测试</div>
      <div class="desc">48 道情境题，覆盖学习、社交、休闲、压力<br>场景更贴近学生生活</div>
      <span class="tag orange">预计 10-15 分钟</span>
    </a>
    
    <div class="footer">
      5 维光谱 · 875 种组合 · 动态形象生成 · <a href="https://github.com/yunzhan3/-/">GitHub</a>
    </div>
  </div>
</div>

</body>
</html>
